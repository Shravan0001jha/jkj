name: IrisWorkplace
options:
  bundleIdPrefix: com.irisforu
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    DEVELOPMENT_TEAM: M9YV87TCT9
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  IrisWorkplace:
    type: application
    platform: iOS
    sources:
      - path: IrisWorkplace
    info:
      path: IrisWorkplace/Info.plist
      properties:
        CFBundleDisplayName: Iris Workplace
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Portrait-only: App Store validation (error 90474) requires this or all four orientations.
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Iris Workplace talks to the Workplace server on your Mac over the local network.
        CFBundleURLTypes:
          - CFBundleURLName: com.irisforu.workplace.auth
            CFBundleURLSchemes: [irisworkplace]
    entitlements:
      path: IrisWorkplace/IrisWorkplace.entitlements
      properties:
        # Remote push. Automatic signing swaps this to "production" in the App Store export.
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.irisforu.workplace
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  IrisWorkplaceTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: IrisWorkplaceTests
      - path: fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: IrisWorkplace
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.irisforu.workplace.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/IrisWorkplace.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/IrisWorkplace
        BUNDLE_LOADER: $(TEST_HOST)
  IrisWorkplaceUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [IrisWorkplaceUITests]
    dependencies:
      - target: IrisWorkplace
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.irisforu.workplace.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: IrisWorkplace
schemes:
  IrisWorkplace:
    build:
      targets:
        IrisWorkplace: all
        IrisWorkplaceTests: [test]
        IrisWorkplaceUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [IrisWorkplaceTests]
  IrisWorkplaceUI:
    build:
      targets:
        IrisWorkplace: all
        IrisWorkplaceUITests: [test]
    test:
      config: Debug
      targets: [IrisWorkplaceUITests]
