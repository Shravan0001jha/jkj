<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05080f">
<meta name="robots" content="noindex, nofollow">
<title>Iris Command</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Mission control: one dark deck, cyan instruments, amber and red for risk. A single committed look. */
:root{
  --void:#05080f; --deck:#0a1220; --panel:#0e1829; --edge:#1c2c45; --grid:rgba(77,227,255,.05);
  --ink:#dce8f7; --dim:#8295b1; --faint:#4f6280;
  --cyan:#4de3ff; --cyan-glow:rgba(77,227,255,.35); --green:#3cf2a0; --amber:#ffb547; --red:#ff5a6e; --violet:#a98bff;
  --display:"Chakra Petch","Rajdhani",system-ui,sans-serif; --body:"IBM Plex Sans",system-ui,-apple-system,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--void);color:var(--ink)}
body{font:15px/1.55 var(--body);min-height:100vh;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px),radial-gradient(ellipse at 50% -20%,rgba(77,227,255,.12),transparent 60%);
  background-size:32px 32px,32px 32px,100% 100%;background-attachment:fixed;
  padding:env(safe-area-inset-top,0) max(16px,env(safe-area-inset-right,0)) calc(32px + env(safe-area-inset-bottom,0)) max(16px,env(safe-area-inset-left,0))}
.wrap{max-width:1120px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:.04em;margin:0;text-wrap:balance}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.label{font-family:var(--display);font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Top bar */
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 0 12px;
  background:linear-gradient(var(--void) 70%,transparent)}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand h1{font-size:1.15rem;color:var(--cyan);text-shadow:0 0 18px var(--cyan-glow)}
.brand span{color:var(--faint);font-family:var(--mono);font-size:.75rem}
.tabs{display:flex;gap:4px;border:1px solid var(--edge);border-radius:8px;padding:3px;background:var(--deck)}
.tab{border:0;background:none;padding:6px 14px;border-radius:6px;cursor:pointer;font-family:var(--display);letter-spacing:.12em;font-size:.78rem;color:var(--dim)}
.tab[aria-selected=true]{background:var(--panel);color:var(--cyan);box-shadow:inset 0 0 0 1px var(--edge),0 0 14px rgba(77,227,255,.12)}
.ghost{border:1px solid var(--edge);background:none;border-radius:6px;padding:6px 10px;color:var(--dim);cursor:pointer;font-size:.8rem}
.ghost:hover{color:var(--ink);border-color:var(--faint)}
.fresh{font-family:var(--mono);font-size:.75rem;color:var(--faint)}
.fresh.stale{color:var(--amber)}

/* Status strip */
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:8px 0 22px}
.stat{background:var(--deck);border:1px solid var(--edge);border-radius:10px;padding:12px 14px;min-width:0}
.stat b{display:block;font-family:var(--display);font-size:1.6rem;font-weight:600;line-height:1.1;margin-top:4px}
.stat small{color:var(--dim);font-size:.78rem}

/* Sections & cards */
section{margin-bottom:28px}
section > header{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
section > header h2{font-size:.95rem;letter-spacing:.14em;text-transform:uppercase}
section > header .count{font-family:var(--mono);color:var(--faint);font-size:.8rem}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{position:relative;background:linear-gradient(180deg,var(--panel),var(--deck));border:1px solid var(--edge);border-radius:12px;padding:16px;cursor:pointer;
  text-align:left;width:100%;transition:border-color .15s,transform .15s;min-width:0}
.card:hover{border-color:var(--faint);transform:translateY(-1px)}
.card::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--h,var(--faint));box-shadow:0 0 12px var(--h,transparent)}
.card h3{font-size:1rem;font-weight:600;letter-spacing:.02em;margin:0 0 10px;padding-right:86px;line-height:1.3}
.pill{position:absolute;top:14px;right:14px;font-family:var(--display);font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;padding:3px 8px;border-radius:99px;border:1px solid currentColor;color:var(--h,var(--dim))}
.h-on-track{--h:var(--green)} .h-at-risk{--h:var(--amber)} .h-late{--h:var(--red)} .h-delivered{--h:var(--cyan)} .h-no-date{--h:var(--faint)}
.dates{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.dates div{min-width:0}
.dates b{display:block;font-family:var(--mono);font-size:.86rem;font-weight:500}
.prog{height:6px;background:var(--void);border-radius:99px;overflow:hidden;border:1px solid var(--edge)}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--green));box-shadow:0 0 10px var(--cyan-glow)}
.meta{display:flex;justify-content:space-between;gap:8px;margin-top:8px;font-size:.8rem;color:var(--dim)}
.reason{margin-top:10px;font-size:.84rem;color:var(--amber)}
.list{display:flex;flex-direction:column;border:1px solid var(--edge);border-radius:12px;overflow:hidden;background:var(--deck)}
.row{display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--edge);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.row:last-child{border-bottom:0}
.row:hover{background:var(--panel)}
.row span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.delta{font-family:var(--mono);font-size:.8rem}
.delta.late{color:var(--red)} .delta.ok{color:var(--green)}

/* Detail */
.back{margin:6px 0 14px}
.detail-head{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:16px}
.detail-head h2{font-size:1.4rem;margin-right:auto}
.detail-head .pill{position:static}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.panel{background:var(--deck);border:1px solid var(--edge);border-radius:12px;padding:16px;min-width:0}
.panel h3{font-size:.8rem;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin-bottom:12px}
.scope{display:flex;flex-direction:column;gap:6px;max-height:420px;overflow:auto;padding-right:4px}
.si{display:flex;gap:10px;align-items:flex-start;font-size:.88rem}
.dot{flex:none;width:9px;height:9px;border-radius:50%;margin-top:6px;background:var(--faint)}
.s-merged{background:var(--green);box-shadow:0 0 8px var(--green)} .s-building{background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
.s-staging{background:var(--violet)} .s-verified{background:var(--green)} .s-dropped{background:#3a4458}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.78rem;color:var(--dim);margin-bottom:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.stack{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--void);border:1px solid var(--edge)}
.stack i{display:block;height:100%}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.kv b{display:block;font-family:var(--display);font-size:1.25rem}
.hist{font-size:.85rem;display:flex;flex-direction:column;gap:6px}
details summary{cursor:pointer;color:var(--dim);font-size:.85rem;margin:8px 0}

/* Gaps */
.bars{display:flex;flex-direction:column;gap:12px}
.bar-row{display:grid;grid-template-columns:minmax(120px,190px) 1fr 70px 90px;gap:12px;align-items:center}
.bar-row .track{height:10px;background:var(--void);border-radius:99px;border:1px solid var(--edge);overflow:hidden}
.bar-row .track i{display:block;height:100%;border-radius:99px}
.bar-row .v{font-family:var(--mono);text-align:right}
.spark{display:block;width:90px;height:24px}
.note{color:var(--faint);font-size:.8rem;margin-top:12px;max-width:72ch}
@media (max-width:560px){
  .bar-row{grid-template-columns:1fr 64px;row-gap:4px}
  .bar-row .track{grid-column:1/-1;grid-row:2}
  .bar-row .spark{display:none}
  .dates{grid-template-columns:repeat(3,minmax(0,1fr))}
  .row{grid-template-columns:1fr auto}
  .row .delta{display:none}
}

/* Login */
.gate{min-height:100vh;display:grid;place-items:center;padding:24px 0}
.console{width:min(420px,100%);background:linear-gradient(180deg,var(--panel),var(--deck));border:1px solid var(--edge);border-radius:16px;padding:28px;
  box-shadow:0 0 0 1px rgba(77,227,255,.06),0 30px 80px rgba(0,0,0,.6),0 0 60px rgba(77,227,255,.08)}
.console h1{color:var(--cyan);font-size:1.35rem;text-shadow:0 0 22px var(--cyan-glow)}
.console p{color:var(--dim);margin:8px 0 20px;font-size:.92rem}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field input{background:var(--void);border:1px solid var(--edge);border-radius:8px;padding:12px 14px;font-size:1rem}
.field input:focus{border-color:var(--cyan);outline:none;box-shadow:0 0 0 3px rgba(77,227,255,.15)}
.code{font-family:var(--mono);letter-spacing:.5em;text-align:center;font-size:1.4rem!important}
.go{width:100%;border:0;border-radius:8px;padding:12px;background:var(--cyan);color:#021018;font-family:var(--display);font-weight:700;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;box-shadow:0 0 24px var(--cyan-glow)}
.go:disabled{opacity:.5;cursor:wait}
.msg{min-height:1.4em;margin-top:12px;font-size:.88rem;color:var(--amber)}
.scan{height:2px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);margin:18px 0 0;opacity:.6;animation:scan 2.6s ease-in-out infinite}
@keyframes scan{0%,100%{transform:scaleX(.2);opacity:.2}50%{transform:scaleX(1);opacity:.7}}
.empty{color:var(--dim);padding:40px 0;text-align:center}
</style>
</head>
<body>
<div id="app" class="wrap"><div class="empty">Loading…</div></div>
<script>
(() => {
  const $ = (s, el = document) => el.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const app = $('#app');
  const CAUSE = {
    'paused/pace-hold': ['Usage cap or pause', '#a98bff'], 'budget-cap': ['Budget cap', '#ff8fb3'], 'staging-down': ['Staging down', '#ff5a6e'],
    'review': ['Waiting for review', '#4de3ff'], 'dependency': ['Waiting on another story', '#7aa2ff'], 'mac-or-device': ['Mac or device', '#ffb547'],
    'owner-decision': ['Your decision', '#c9d6ea'], 'queued-behind-busy': ['Queued behind a busy person', '#ffd37a'], 'parked': ['Parked', '#3a4458'], 'unknown': ['Not classified', '#4f6280'],
  };
  const HEALTH = { 'on-track': 'On track', 'at-risk': 'At risk', 'late': 'Late', 'delivered': 'Delivered', 'no-date': 'No date' };
  const fmtDate = d => d ? new Date(d + (d.length === 10 ? 'T00:00:00Z' : '')).toLocaleDateString(undefined, { day: 'numeric', month: 'short' }) : '—';
  const daysBetween = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 86400000);
  let snap = null, tab = 'roadmap';

  async function api(path, opts = {}) {
    const r = await fetch(path, { credentials: 'same-origin', ...opts, headers: { 'content-type': 'application/json', ...(opts.method && opts.method !== 'GET' ? { 'x-dash': '1' } : {}), ...(opts.headers || {}) } });
    return r;
  }

  // ---------- Login ----------
  function gate() {
    app.innerHTML = `<div class="gate"><form class="console" id="f" novalidate>
      <div class="label">Restricted · owner only</div>
      <h1 style="margin-top:8px">IRIS // COMMAND</h1>
      <p id="lead">Enter your email. If it's the owner's, a 6-digit code arrives within a minute.</p>
      <div class="field" id="ef"><label class="label" for="email">Email</label><input id="email" type="email" autocomplete="email" inputmode="email" required></div>
      <div class="field" id="cf" hidden><label class="label" for="code">Code</label><input id="code" class="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}"></div>
      <button class="go" id="go" type="submit">Send code</button>
      <div class="msg" id="msg" role="status"></div><div class="scan"></div></form></div>`;
    const f = $('#f'), go = $('#go'), msg = $('#msg');
    let stage = 'email';
    try { $('#email').value = localStorage.getItem('dash-email') || ''; } catch {}
    f.addEventListener('submit', async e => {
      e.preventDefault(); msg.textContent = ''; go.disabled = true;
      const email = $('#email').value.trim();
      try {
        if (stage === 'email') {
          if (!email.includes('@')) { msg.textContent = 'Enter a full email address.'; return; }
          try { localStorage.setItem('dash-email', email); } catch {}
          await api('/api/login/start', { method: 'POST', body: JSON.stringify({ email }) });
          stage = 'code'; $('#cf').hidden = false; $('#ef').hidden = true; go.textContent = 'Enter';
          $('#lead').textContent = `If ${email} is the owner's email, a code is on its way. It expires in 10 minutes.`;
          $('#code').focus();
        } else {
          const r = await api('/api/login/verify', { method: 'POST', body: JSON.stringify({ email, code: $('#code').value.trim() }) });
          if (r.ok) { boot(); return; }
          msg.textContent = 'That code did not work. Check it, or reload to ask for a new one.';
        }
      } catch { msg.textContent = 'No connection. Try again.'; }
      finally { go.disabled = false; }
    });
    $('#email').focus();
  }

  // ---------- Shell ----------
  function shell(inner) {
    const age = snap ? Math.round((Date.now() - Date.parse(snap.generatedAt)) / 60000) : null;
    const fresh = age === null ? '' : age < 90 ? `updated ${age < 1 ? 'just now' : age + ' min ago'}` : `updated ${Math.round(age / 60)} h ago`;
    app.innerHTML = `<div class="bar"><div class="brand"><h1>IRIS // COMMAND</h1><span>workplace</span></div>
      <div class="tabs" role="tablist"><button class="tab" role="tab" data-t="roadmap" aria-selected="${tab === 'roadmap'}">Roadmap</button><button class="tab" role="tab" data-t="gaps" aria-selected="${tab === 'gaps'}">Gaps</button></div>
      <span class="fresh ${age > 180 ? 'stale' : ''}">${esc(fresh)}</span><button class="ghost" id="out">Sign out</button></div>${inner}`;
    app.querySelectorAll('.tab').forEach(b => b.onclick = () => { location.hash = b.dataset.t; });
    $('#out').onclick = async () => { await api('/api/logout', { method: 'POST' }); snap = null; gate(); };
  }

  // ---------- Roadmap ----------
  function card(f) {
    const total = f.done + f.remaining, pct = total ? Math.round((f.done / total) * 100) : 0;
    return `<button class="card h-${f.health}" data-f="${esc(f.id)}"><span class="pill">${HEALTH[f.health]}</span><h3>${esc(f.name)}</h3>
      <div class="dates"><div><span class="label">Committed</span><b>${fmtDate(f.committedDate)}</b></div><div><span class="label">Forecast</span><b>${f.forecast.p50 ? fmtDate(f.forecast.p50) : (f.state === 'delivered' ? '—' : 'stalled')}</b></div><div><span class="label">Age</span><b>${f.ageDays == null ? '—' : f.ageDays + ' d'}</b></div></div>
      <div class="prog"><i style="width:${pct}%"></i></div><div class="meta"><span>${f.done} done · ${f.remaining} open</span><span class="mono">${pct}%</span></div>
      ${f.healthReason ? `<div class="reason">${esc(reasonText(f.healthReason))}</div>` : ''}</button>`;
  }
  const reasonText = r => r.replace(/waiting on ([a-z/-]+)$/, (_, c) => c === 'parked' ? 'parked' : 'waiting: ' + (CAUSE[c]?.[0] ?? c).toLowerCase());
  function roadmap() {
    const live = snap.features.filter(f => f.state !== 'delivered');
    const active = live.filter(f => f.health !== 'no-date'), undated = live.filter(f => f.health === 'no-date');
    const done = snap.features.filter(f => f.state === 'delivered').sort((a, b) => (b.deliveredAt || '').localeCompare(a.deliveredAt || ''));
    const risky = live.filter(f => f.health === 'late' || f.health === 'at-risk').length;
    const strip = `<div class="strip">
      <div class="stat"><span class="label">In flight</span><b>${live.length}</b><small>${active.length} with a date</small></div>
      <div class="stat"><span class="label">Late or at risk</span><b style="color:${risky ? 'var(--amber)' : 'var(--green)'}">${risky}</b><small>against the committed date</small></div>
      <div class="stat"><span class="label">Delivered</span><b>${done.length}</b><small>since 27 Sep</small></div></div>`;
    const sec = (title, items, body) => items.length ? `<section><header><h2>${title}</h2><span class="count">${items.length}</span></header>${body}</section>` : '';
    const rows = done.map(f => {
      const d = f.deliveredAt?.slice(0, 10), promised = f.originalDate || f.committedDate;
      const delta = d && promised ? daysBetween(promised, d) : null;
      return `<button class="row" data-f="${esc(f.id)}"><span>${esc(f.name)}</span><span class="mono">${fmtDate(d)}</span><span class="delta ${delta > 0 ? 'late' : 'ok'}">${delta == null ? 'no date set' : delta > 0 ? `+${delta} d vs promise` : 'on time'}</span></button>`;
    }).join('');
    shell(strip + sec('Committed', active, `<div class="cards">${active.map(card).join('')}</div>`)
      + sec('In progress, no date yet', undated, `<div class="cards">${undated.map(card).join('')}</div>`)
      + sec('Delivered', done, `<div class="list">${rows}</div>`)
      + `<p class="note">${esc(snap.notes.join(' '))}</p>`);
    app.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { location.hash = 'f-' + b.dataset.f; });
  }

  // ---------- Feature ----------
  function feature(id) {
    const f = snap.features.find(x => x.id === id);
    if (!f) { location.hash = 'roadmap'; return; }
    const lost = Object.entries(f.lostDays).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]);
    const totalLost = lost.reduce((n, [, v]) => n + v, 0), all = totalLost + f.buildingDays;
    const stack = all ? `<div class="stack"><i style="width:${(f.buildingDays / all) * 100}%;background:var(--green)" title="Building"></i>${lost.map(([c, v]) => `<i style="width:${(v / all) * 100}%;background:${CAUSE[c]?.[1] ?? '#555'}" title="${esc(CAUSE[c]?.[0] ?? c)}"></i>`).join('')}</div>` : '<p class="note">No work recorded yet.</p>';
    const legend = `<div class="legend"><span><i class="dot" style="background:var(--green)"></i>Building ${f.buildingDays} d</span>${lost.map(([c, v]) => `<span><i class="dot" style="background:${CAUSE[c]?.[1] ?? '#555'}"></i>${esc(CAUSE[c]?.[0] ?? c)} ${v} d</span>`).join('')}</div>`;
    const order = ['building', 'not-started', 'staging', 'merged', 'verified', 'dropped'];
    const label = { building: 'Building', 'not-started': 'Not started', staging: 'On staging', merged: 'Merged', verified: 'Verified on your phone', dropped: 'Dropped' };
    const groups = order.map(s => [s, f.scope.filter(x => x.status === s)]).filter(([, xs]) => xs.length);
    const scope = groups.map(([s, xs]) => {
      const items = xs.map(x => `<div class="si"><i class="dot s-${s}"></i><span>${esc(x.label)}</span></div>`).join('');
      return (s === 'merged' || s === 'dropped' || xs.length > 25) && s !== 'building'
        ? `<details><summary>${label[s]} · ${xs.length}</summary><div class="scope">${items}</div></details>`
        : `<div class="label" style="margin:10px 0 6px">${label[s]} · ${xs.length}</div><div class="scope">${items}</div>`;
    }).join('');
    const hist = f.dateHistory.length ? f.dateHistory.map(h => `<div><span class="mono">${fmtDate(h.at.slice(0, 10))}</span> · ${h.from ? `${fmtDate(h.from)} → ` : 'set to '}<b>${fmtDate(h.to)}</b></div>`).join('') : '<div class="note">The date has never moved.</div>';
    shell(`<button class="ghost back" id="back">← Roadmap</button>
      <div class="detail-head"><h2>${esc(f.name)}</h2><span class="pill h-${f.health}" style="color:var(--h)">${HEALTH[f.health]}</span></div>
      <div class="strip"><div class="stat"><span class="label">Committed</span><b class="mono">${fmtDate(f.committedDate)}</b><small>first promised ${fmtDate(f.originalDate)}</small></div>
        <div class="stat"><span class="label">Forecast</span><b class="mono">${fmtDate(f.forecast.p50)}</b><small>worst case ${fmtDate(f.forecast.p90)}</small></div>
        <div class="stat"><span class="label">Progress</span><b>${f.done}/${f.done + f.remaining}</b><small>stories done</small></div>
        <div class="stat"><span class="label">Age</span><b>${f.ageDays ?? '—'}${f.ageDays != null ? ' d' : ''}</b><small>since the first story started</small></div></div>
      <div class="grid2"><div class="panel"><h3>What you get</h3>${scope || '<p class="note">No stories yet.</p>'}</div>
        <div style="display:flex;flex-direction:column;gap:14px">
          <div class="panel"><h3>Where the time went</h3>${legend}${stack}<p class="note">Story-days: each story's days added up, so stories waiting together count separately.</p></div>
          <div class="panel"><h3>Numbers</h3><div class="kv"><div><span class="label">Send-backs</span><b>${f.sendBacks}</b></div><div><span class="label">Model cost</span><b>₹${f.costInr.toLocaleString('en-IN')}</b></div><div><span class="label">Started</span><b class="mono" style="font-size:1rem">${fmtDate(f.startedAt?.slice(0, 10))}</b></div><div><span class="label">Delivered</span><b class="mono" style="font-size:1rem">${fmtDate(f.deliveredAt?.slice(0, 10))}</b></div></div></div>
          <div class="panel"><h3>Date history</h3><div class="hist">${hist}</div></div></div></div>`);
    $('#back').onclick = () => { location.hash = 'roadmap'; };
  }

  // ---------- Gaps ----------
  function spark(vals, color) {
    const max = Math.max(...vals, 0.01), w = 90, h = 24, n = vals.length;
    const pts = vals.map((v, i) => `${(i / Math.max(1, n - 1)) * (w - 4) + 2},${h - 3 - (v / max) * (h - 6)}`).join(' ');
    return `<svg class="spark" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.6"/><circle cx="${pts.split(' ').pop().split(',')[0]}" cy="${pts.split(' ').pop().split(',')[1]}" r="2.4" fill="${color}"/></svg>`;
  }
  function gaps() {
    const g = snap.gaps, max = Math.max(...g.lostDaysByCause.map(x => x.days), 1);
    const bars = g.lostDaysByCause.map(x => {
      const [name, color] = CAUSE[x.cause] ?? [x.cause, '#888'];
      return `<div class="bar-row"><span>${esc(name)}</span><div class="track"><i style="width:${(x.days / max) * 100}%;background:${color};box-shadow:0 0 10px ${color}55"></i></div><span class="v">${x.days}</span>${spark(x.weekly, color)}</div>`;
    }).join('');
    const rw = g.reviewWait;
    shell(`<div class="strip">
        <div class="stat"><span class="label">Review, approval 1</span><b class="mono">${rw.approval1Minutes.p50 ?? '—'} min</b><small>median · 90% within ${rw.approval1Minutes.p90 ?? '—'} min</small></div>
        <div class="stat"><span class="label">Review, approval 2</span><b class="mono">${rw.approval2Minutes.p50 ?? '—'} min</b><small>median · 90% within ${rw.approval2Minutes.p90 ?? '—'} min</small></div>
        <div class="stat"><span class="label">Staging down</span><b class="mono">${g.stagingDownDays} d</b><small>last 30 days</small></div>
        <div class="stat"><span class="label">Send-backs</span><b class="mono">${g.sendBacks}</b><small>all time</small></div></div>
      <section><header><h2>Where waiting time went</h2><span class="count">last 30 days · story-days</span></header>
        <div class="panel"><div class="bars">${bars}</div>
        <p class="note">Each bar adds up the days stories spent waiting for that reason. The lines show the trend over five 6-day windows, oldest on the left. Parked work (${g.parkedStoryDays} story-days) is left out, because it was put aside on purpose. ${Math.round(snap.unknownShare * 100)}% of waiting time could not be matched to a reason.</p></div></section>`);
  }

  // ---------- Router ----------
  function route() {
    if (!snap) return;
    const h = location.hash.slice(1);
    if (h.startsWith('f-')) { tab = 'roadmap'; feature(h.slice(2)); }
    else if (h === 'gaps') { tab = 'gaps'; gaps(); }
    else { tab = 'roadmap'; roadmap(); }
    window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', route);

  async function load() {
    const r = await api('/api/snapshot');
    if (r.status === 401) { gate(); return false; }
    if (!r.ok) { app.innerHTML = '<div class="empty">The dashboard data is not available right now. Try again in a few minutes.</div>'; return false; }
    snap = await r.json();
    return true;
  }
  async function boot() {
    try { if (await load()) route(); } catch { app.innerHTML = '<div class="empty">No connection. Reload to try again.</div>'; }
  }
  // Fresh numbers without a manual refresh: reload the snapshot every 10 minutes while open, and on return to the tab.
  setInterval(() => { if (snap && !document.hidden) load().then(ok => ok && route()); }, 600000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && snap) load().then(ok => ok && route()); });
  boot();
})();
</script>
</body>
</html>
