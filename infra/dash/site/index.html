<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05080f">
<meta name="robots" content="noindex, nofollow">
<title>Iris Command</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Mission control: one dark deck, cyan instruments, amber and red for risk. A single committed look. */
:root{
  --void:#05080f; --deck:#0a1220; --panel:#0e1829; --edge:#1c2c45; --grid:rgba(77,227,255,.05);
  --ink:#dce8f7; --dim:#8295b1; --faint:#4f6280;
  --cyan:#4de3ff; --cyan-glow:rgba(77,227,255,.35); --green:#3cf2a0; --amber:#ffb547; --red:#ff5a6e; --violet:#a98bff;
  --display:"Chakra Petch","Rajdhani",system-ui,sans-serif; --body:"IBM Plex Sans",system-ui,-apple-system,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--void);color:var(--ink)}
body{font:15px/1.55 var(--body);min-height:100vh;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px),radial-gradient(ellipse at 50% -20%,rgba(77,227,255,.12),transparent 60%);
  background-size:32px 32px,32px 32px,100% 100%;background-attachment:fixed;
  padding:env(safe-area-inset-top,0) max(16px,env(safe-area-inset-right,0)) calc(32px + env(safe-area-inset-bottom,0)) max(16px,env(safe-area-inset-left,0))}
.wrap{max-width:1120px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:.04em;margin:0;text-wrap:balance}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.label{font-family:var(--display);font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Top bar */
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 0 12px;background:linear-gradient(var(--void) 75%,transparent)}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand h1{font-size:1.15rem;color:var(--cyan);text-shadow:0 0 18px var(--cyan-glow)}
.tabs{display:flex;gap:4px;border:1px solid var(--edge);border-radius:8px;padding:3px;background:var(--deck)}
.tab{border:0;background:none;padding:6px 14px;border-radius:6px;cursor:pointer;font-family:var(--display);letter-spacing:.12em;font-size:.78rem;color:var(--dim)}
.tab[aria-selected=true]{background:var(--panel);color:var(--cyan);box-shadow:inset 0 0 0 1px var(--edge),0 0 14px rgba(77,227,255,.12)}
.ghost{border:1px solid var(--edge);background:none;border-radius:6px;padding:6px 10px;color:var(--dim);cursor:pointer;font-size:.8rem}
.ghost:hover{color:var(--ink);border-color:var(--faint)}
.fresh{font-family:var(--mono);font-size:.72rem;color:var(--faint)}
/* Tiles */
.hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:6px 0 24px}
.tile{background:linear-gradient(180deg,var(--panel),var(--deck));border:1px solid var(--edge);border-radius:14px;padding:14px 16px;min-width:0;display:flex;flex-direction:column;gap:6px}
.big{font-family:var(--display);font-size:2.2rem;font-weight:600;line-height:1}
.sub{font-family:var(--mono);font-size:.75rem;color:var(--dim)}
.up{color:var(--green)} .down{color:var(--amber)}
h2.sec{font-size:.82rem;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin:6px 0 12px}
/* Product grid */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:28px}
@media (max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.grid{grid-template-columns:1fr}}
.prod{position:relative;background:linear-gradient(180deg,var(--panel),var(--deck));border:1px solid var(--edge);border-radius:14px;padding:14px;cursor:pointer;text-align:left;width:100%;color:inherit;display:grid;grid-template-columns:76px 1fr;gap:4px 12px;align-items:center;transition:border-color .15s,transform .15s}
.prod:hover{border-color:var(--faint);transform:translateY(-1px)}
.prod h3{grid-column:1/-1;font-size:.95rem;font-weight:600;letter-spacing:.02em;display:flex;justify-content:space-between;gap:8px;align-items:center;min-width:0}
.prod h3 span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ring{width:76px;height:76px}
.ring text{font-family:var(--display);font-weight:600;fill:var(--ink)}
.dates{grid-column:1/-1;display:flex;justify-content:space-between;font-family:var(--mono);font-size:.72rem;color:var(--dim);margin-top:4px}
.st{display:inline-flex;align-items:center;gap:5px;font-family:var(--display);font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;padding:2px 8px;border-radius:99px;border:1px solid currentColor;white-space:nowrap;flex:none}
.st-on-track,.st-delivered{color:var(--green)} .st-at-risk{color:var(--amber)} .st-late{color:var(--red)} .st-no-date{color:var(--faint)}
/* Charts */
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px;margin-bottom:28px}
.chart{background:var(--deck);border:1px solid var(--edge);border-radius:14px;padding:14px 14px 8px;min-width:0}
.chart h3{font-size:.74rem;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin-bottom:8px;font-weight:600}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.ax{fill:var(--faint);font-family:var(--mono);font-size:10px}
.gl{stroke:rgba(130,149,177,.12);stroke-width:1}
.legend{display:flex;flex-wrap:wrap;gap:10px 14px;font-size:.74rem;color:var(--dim);margin:2px 0 8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.hit{fill:transparent;cursor:crosshair}
#tip{position:fixed;z-index:20;pointer-events:none;background:#020509ee;border:1px solid var(--edge);border-radius:8px;padding:7px 10px;font:12px/1.4 var(--mono);color:var(--ink);box-shadow:0 8px 24px rgba(0,0,0,.5);max-width:260px}
/* Detail */
.back{margin:6px 0 12px}
.dhead{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:14px}
.dhead h2{font-size:1.5rem;margin-right:auto}
.epics{display:flex;flex-direction:column;gap:8px}
.ep{display:grid;grid-template-columns:1fr 120px 52px;gap:12px;align-items:center;font-size:.86rem}
.ep span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meter{height:8px;background:var(--void);border:1px solid var(--edge);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--green))}
.note{color:var(--faint);font-size:.76rem;margin:16px 0 0;max-width:80ch}
@media (max-width:560px){.ep{grid-template-columns:1fr 70px 44px}.big{font-size:1.6rem}.hero{grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px}.tile{padding:10px 12px}}
.since{display:flex;flex-wrap:wrap;gap:8px;margin:-10px 0 22px}
.chip{font-family:var(--mono);font-size:.74rem;padding:4px 10px;border-radius:99px;border:1px solid var(--edge);background:var(--deck);color:var(--dim)}
.chip b{color:var(--ink);font-weight:500}
.stage{grid-column:1/-1;display:flex;height:6px;border-radius:99px;overflow:hidden;background:var(--void);gap:2px;margin-top:6px}
.stage i{display:block;height:100%}
.gantt-row{display:grid;grid-template-columns:170px 1fr;gap:10px;align-items:center;font-size:.82rem;min-height:26px}
.gantt-row > span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.heat{display:grid;gap:3px;font-size:.74rem}
.heat .c{height:22px;border-radius:4px;display:grid;place-items:center;font-family:var(--mono);font-size:.68rem}
.heat .h{color:var(--faint);font-family:var(--mono);text-align:center}
.heat .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--dim)}
@media (max-width:560px){.gantt-row{grid-template-columns:96px 1fr}.ax.odd{display:none}}
/* Login */
.gate{min-height:100vh;display:grid;place-items:center;padding:24px 0}
.console{width:min(420px,100%);background:linear-gradient(180deg,var(--panel),var(--deck));border:1px solid var(--edge);border-radius:16px;padding:28px;
  box-shadow:0 0 0 1px rgba(77,227,255,.06),0 30px 80px rgba(0,0,0,.6),0 0 60px rgba(77,227,255,.08)}
.console h1{color:var(--cyan);font-size:1.35rem;text-shadow:0 0 22px var(--cyan-glow)}
.console p{color:var(--dim);margin:8px 0 20px;font-size:.92rem}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field input{background:var(--void);border:1px solid var(--edge);border-radius:8px;padding:12px 14px;font-size:1rem}
.field input:focus{border-color:var(--cyan);outline:none;box-shadow:0 0 0 3px rgba(77,227,255,.15)}
.code{font-family:var(--mono);letter-spacing:.5em;text-align:center;font-size:1.4rem!important}
.go{width:100%;border:0;border-radius:8px;padding:12px;background:var(--cyan);color:#021018;font-family:var(--display);font-weight:700;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;box-shadow:0 0 24px var(--cyan-glow)}
.go:disabled{opacity:.5;cursor:wait}
.msg{min-height:1.4em;margin-top:12px;font-size:.88rem;color:var(--amber)}
.scan{height:2px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);margin:18px 0 0;opacity:.6;animation:scan 2.6s ease-in-out infinite}
@keyframes scan{0%,100%{transform:scaleX(.2);opacity:.2}50%{transform:scaleX(1);opacity:.7}}
.empty{color:var(--dim);padding:40px 0;text-align:center}
</style>
</head>
<body>
<div id="app" class="wrap"><div class="empty">Loading…</div></div>
<script>
(() => {
  const $ = (s, el = document) => el.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const app = $('#app');
  const CAUSE = {
    'paused/pace-hold': ['Usage cap or pause', '#a98bff'], 'budget-cap': ['Budget cap', '#ff8fb3'], 'staging-down': ['Staging down', '#ff5a6e'],
    'review': ['Waiting for review', '#4de3ff'], 'dependency': ['Waiting on another story', '#7aa2ff'], 'mac-or-device': ['Mac or device', '#ffb547'],
    'owner-decision': ['Your decision', '#c9d6ea'], 'queued-behind-busy': ['Queued behind a busy person', '#ffd37a'], 'parked': ['Parked', '#3a4458'], 'unknown': ['Not classified', '#4f6280'],
  };
  const HEALTH = { 'on-track': 'On track', 'at-risk': 'At risk', 'late': 'Late', 'delivered': 'Delivered', 'no-date': 'No date' };
  const fmtDate = d => d ? new Date(d + (d.length === 10 ? 'T00:00:00Z' : '')).toLocaleDateString(undefined, { day: 'numeric', month: 'short' }) : '—';
  const daysBetween = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 86400000);
  let snap = null, tab = 'product';

  async function api(path, opts = {}) {
    const r = await fetch(path, { credentials: 'same-origin', ...opts, headers: { 'content-type': 'application/json', ...(opts.method && opts.method !== 'GET' ? { 'x-dash': '1' } : {}), ...(opts.headers || {}) } });
    return r;
  }

  // ---------- Login ----------
  function gate() {
    app.innerHTML = `<div class="gate"><form class="console" id="f" novalidate>
      <div class="label">Restricted · owner only</div>
      <h1 style="margin-top:8px">IRIS // COMMAND</h1>
      <p id="lead">Enter your email. If it's the owner's, a 6-digit code arrives within a minute.</p>
      <div class="field" id="ef"><label class="label" for="email">Email</label><input id="email" type="email" autocomplete="email" inputmode="email" required></div>
      <div class="field" id="cf" hidden><label class="label" for="code">Code</label><input id="code" class="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}"></div>
      <button class="go" id="go" type="submit">Send code</button>
      <div class="msg" id="msg" role="status"></div><div class="scan"></div></form></div>`;
    const f = $('#f'), go = $('#go'), msg = $('#msg');
    let stage = 'email';
    try { $('#email').value = localStorage.getItem('dash-email') || ''; } catch {}
    f.addEventListener('submit', async e => {
      e.preventDefault(); msg.textContent = ''; go.disabled = true;
      const email = $('#email').value.trim();
      try {
        if (stage === 'email') {
          if (!email.includes('@')) { msg.textContent = 'Enter a full email address.'; return; }
          try { localStorage.setItem('dash-email', email); } catch {}
          await api('/api/login/start', { method: 'POST', body: JSON.stringify({ email }) });
          stage = 'code'; $('#cf').hidden = false; $('#ef').hidden = true; go.textContent = 'Enter';
          $('#lead').textContent = `If ${email} is the owner's email, a code is on its way. It expires in 10 minutes.`;
          $('#code').focus();
        } else {
          const r = await api('/api/login/verify', { method: 'POST', body: JSON.stringify({ email, code: $('#code').value.trim() }) });
          if (r.ok) { boot(); return; }
          msg.textContent = 'That code did not work. Check it, or reload to ask for a new one.';
        }
      } catch { msg.textContent = 'No connection. Try again.'; }
      finally { go.disabled = false; }
    });
    $('#email').focus();
  }

  // ---------- Shell ----------
  const tip = document.createElement('div'); tip.id = 'tip'; tip.hidden = true; document.body.appendChild(tip);
  document.addEventListener('pointermove', e => {
    const t = e.target.closest?.('[data-tip]');
    if (!t) { tip.hidden = true; return; }
    tip.innerHTML = t.getAttribute('data-tip'); tip.hidden = false;
    const x = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8), y = Math.max(8, e.clientY - tip.offsetHeight - 12);
    tip.style.left = x + 'px'; tip.style.top = y + 'px';
  });
  function shell(inner) {
    const age = snap ? Math.round((Date.now() - Date.parse(snap.generatedAt)) / 60000) : null;
    const fresh = age === null ? '' : age < 90 ? `${age < 1 ? 'now' : age + ' min ago'}` : `${Math.round(age / 60)} h ago`;
    app.innerHTML = `<div class="bar"><div class="brand"><h1>IRIS // COMMAND</h1></div>
      <div class="tabs" role="tablist"><button class="tab" role="tab" data-t="product" aria-selected="${tab === 'product'}">Product</button><button class="tab" role="tab" data-t="workplace" aria-selected="${tab === 'workplace'}">Workplace</button></div>
      <span class="fresh">⟳ ${esc(fresh)}</span><button class="ghost" id="out">Sign out</button></div>${inner}`;
    app.querySelectorAll('.tab').forEach(b => b.onclick = () => { location.hash = b.dataset.t; });
    $('#out').onclick = async () => { await api('/api/logout', { method: 'POST' }); snap = null; gate(); };
    app.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { location.hash = 'p-' + b.dataset.p; });
  }
  const wk = d => new Date(d + 'T00:00:00Z').toLocaleDateString(undefined, { day: 'numeric', month: 'short', timeZone: 'UTC' });
  const ST = { 'on-track': ['●', 'On track'], 'at-risk': ['▲', 'At risk'], late: ['■', 'Late'], delivered: ['✓', 'Delivered'], 'no-date': ['○', 'No date'] };
  const status = h => `<span class="st st-${h}">${ST[h][0]} ${ST[h][1]}</span>`;

  // ---------- Charts (SVG, one scale per chart, hover tips) ----------
  let W = 340, H = 150; const P = { l: 30, r: 10, t: 10, b: 22 };
  const wide = f => { W = 1000; H = 230; try { return f(); } finally { W = 340; H = 150; } };
  const niceMax = v => { if (v <= 0) return 1; const m = Math.pow(10, Math.floor(Math.log10(v))), n = v / m; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * m; };
  function frame(max, labels) {
    const ih = H - P.t - P.b, ticks = [0, max / 2, max];
    const g = ticks.map(v => { const y = P.t + ih - (v / max) * ih; return `<line class="gl" x1="${P.l}" x2="${W - P.r}" y1="${y}" y2="${y}"/><text class="ax" x="${P.l - 6}" y="${y + 3}" text-anchor="end">${v >= 1000 ? Math.round(v / 1000) + 'k' : Math.round(v * 10) / 10}</text>`; }).join('');
    const iw = W - P.l - P.r, step = iw / labels.length;
    const xl = labels.map((l, i) => (i % Math.ceil(labels.length / 6) === 0 || i === labels.length - 1) ? `<text class="ax" x="${P.l + step * i + step / 2}" y="${H - 6}" text-anchor="middle">${esc(l)}</text>` : '').join('');
    return { g: g + xl, ih, iw, step };
  }
  function bars(values, labels, color, unit) {
    const max = niceMax(Math.max(...values, 1)), f = frame(max, labels), bw = Math.min(26, f.step - 6);
    const b = values.map((v, i) => { const h = (v / max) * f.ih, x = P.l + f.step * i + (f.step - bw) / 2, y = P.t + f.ih - h;
      return `<path d="M${x},${P.t + f.ih} V${y + Math.min(4, h)} q0,-4 4,-4 h${bw - 8} q4,0 4,4 V${P.t + f.ih} Z" fill="${color}" opacity="${h ? 1 : 0}"/><rect class="hit" x="${P.l + f.step * i}" y="${P.t}" width="${f.step}" height="${f.ih}" data-tip="<b>${esc(labels[i])}</b><br>${v} ${unit}"/>`; }).join('');
    return `<svg viewBox="0 0 ${W} ${H}" role="img">${f.g}${b}</svg>`;
  }
  function lines(series, labels, unit, opts = {}) {
    const all = series.flatMap(s => s.values.filter(v => v != null));
    const max = niceMax(Math.max(...all, 1)), f = frame(max, labels);
    const X = i => P.l + f.step * i + f.step / 2, Y = v => P.t + f.ih - (v / max) * f.ih;
    const paths = series.map(s => {
      const pts = s.values.map((v, i) => v == null ? null : [X(i), Y(v)]).filter(Boolean);
      const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0] + ',' + p[1]).join(' ');
      const area = s.area && pts.length ? `<path d="${d} L${pts.at(-1)[0]},${P.t + f.ih} L${pts[0][0]},${P.t + f.ih} Z" fill="${s.color}" opacity=".12"/>` : '';
      const last = pts.at(-1);
      return `${area}<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" ${s.dash ? 'stroke-dasharray="4 4"' : ''} stroke-linejoin="round"/>${last ? `<circle cx="${last[0]}" cy="${last[1]}" r="4" fill="${s.color}" stroke="var(--deck)" stroke-width="2"/>` : ''}`;
    }).join('');
    const hits = labels.map((l, i) => `<rect class="hit" x="${P.l + f.step * i}" y="${P.t}" width="${f.step}" height="${f.ih}" data-tip="<b>${esc(l)}</b>${series.map(s => `<br>${esc(s.name)}: ${s.values[i] ?? '—'} ${unit}`).join('')}"/>`).join('');
    return `<svg viewBox="0 0 ${W} ${H}" role="img">${f.g}${paths}${hits}</svg>`;
  }
  function stacked(layers, labels, unit) {
    const tot = labels.map((_, i) => layers.reduce((n, l) => n + l.values[i], 0));
    const max = niceMax(Math.max(...tot, 1)), f = frame(max, labels), bw = Math.min(26, f.step - 6);
    let out = '';
    labels.forEach((lab, i) => {
      let y = P.t + f.ih; const x = P.l + f.step * i + (f.step - bw) / 2;
      layers.forEach(l => { const h = (l.values[i] / max) * f.ih; if (h > 0.5) { y -= h; out += `<rect x="${x}" y="${y + 1}" width="${bw}" height="${Math.max(0, h - 2)}" rx="2" fill="${l.color}"/>`; } });
      out += `<rect class="hit" x="${P.l + f.step * i}" y="${P.t}" width="${f.step}" height="${f.ih}" data-tip="<b>${esc(lab)}</b>${layers.map(l => `<br>${esc(l.name)}: ${l.values[i]} ${unit}`).join('')}"/>`;
    });
    return `<svg viewBox="0 0 ${W} ${H}" role="img">${f.g}${out}</svg>`;
  }
  function ring(done, total) {
    const p = total ? done / total : 0, r = 30, c = 2 * Math.PI * r;
    return `<svg class="ring" viewBox="0 0 76 76" role="img" aria-label="${Math.round(p * 100)}% done"><circle cx="38" cy="38" r="${r}" fill="none" stroke="var(--edge)" stroke-width="7"/><circle cx="38" cy="38" r="${r}" fill="none" stroke="var(--cyan)" stroke-width="7" stroke-linecap="round" stroke-dasharray="${c * p} ${c}" transform="rotate(-90 38 38)" style="filter:drop-shadow(0 0 4px var(--cyan-glow))"/><text x="38" y="43" text-anchor="middle" font-size="15">${Math.round(p * 100)}%</text></svg>`;
  }
  function mini(p) {   // tiny burn-up: scope (dashed) vs done
    const w = 150, h = 54, max = Math.max(...p.burnup.total, 1), n = p.burnup.total.length;
    const X = i => 2 + (i / Math.max(1, n - 1)) * (w - 6), Y = v => h - 4 - (v / max) * (h - 10);
    const d = a => a.map((v, i) => (i ? 'L' : 'M') + X(i) + ',' + Y(v)).join(' ');
    return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:54px" aria-hidden="true"><path d="${d(p.burnup.total)}" fill="none" stroke="var(--faint)" stroke-width="1.5" stroke-dasharray="3 3"/><path d="${d(p.burnup.done)} L${X(n - 1)},${h - 4} L${X(0)},${h - 4} Z" fill="var(--cyan)" opacity=".12"/><path d="${d(p.burnup.done)}" fill="none" stroke="var(--cyan)" stroke-width="2"/></svg>`;
  }
  const CAUSE_COLORS = ['#3987e5', '#d95926', '#199e70', '#c98500', '#d55181'];
  function causeLayers(byCause) {
    const tot = Object.entries(byCause).map(([c, v]) => [c, v, v.reduce((a, b) => a + b, 0)]).sort((a, b) => b[2] - a[2]);
    const top = tot.slice(0, 4), rest = tot.slice(4);
    const layers = top.map(([c, v], i) => ({ name: CAUSE[c]?.[0] ?? c, values: v, color: CAUSE_COLORS[i] }));
    if (rest.length) layers.push({ name: 'Other', values: rest[0][1].map((_, i) => Math.round(rest.reduce((n, r) => n + r[1][i], 0) * 10) / 10), color: CAUSE_COLORS[4] });
    return layers;
  }
  const legend = layers => `<div class="legend">${layers.map(l => `<span><i style="background:${l.color}"></i>${esc(l.name)}</span>`).join('')}</div>`;


  // ---------- v3 widgets ----------
  const STAGE = [['prod', '#3cf2a0', 'In prod'], ['staging', '#9085e9', 'On staging'], ['merged', '#3987e5', 'Merged']];
  const FILER = [['qa', '#3987e5', 'QA'], ['coo', '#d95926', 'COO (your reports)'], ['cto', '#199e70', 'CTO'], ['team', '#c98500', 'Team'], ['system', '#d55181', 'System']];
  function stageBar(r) {
    const t = r.merged + r.staging + r.prod || 1;
    return `<div class="stage" data-tip="In prod ${r.prod} · on staging ${r.staging} · merged ${r.merged}">${STAGE.map(([k, c]) => r[k] ? `<i style="width:${(r[k] / t) * 100}%;background:${c}"></i>` : '').join('')}</div>`;
  }
  function gauge(u, allowance, projected) {
    if (u == null) return '<span class="big">—</span>';
    const a = Math.PI, r = 44, cx = 56, cy = 54, pt = f => [cx - r * Math.cos(a * Math.min(1, f)), cy - r * Math.sin(a * Math.min(1, f))];
    const arc = f => { const [x, y] = pt(f); return `M${cx - r},${cy} A${r},${r} 0 0 1 ${x},${y}`; };
    const [ax, ay] = pt(allowance ?? 0);
    const col = projected > 0.9 ? 'var(--amber)' : 'var(--cyan)';
    return `<svg viewBox="0 0 112 64" style="width:130px;height:74px" data-tip="Used ${Math.round(u * 100)}% of the week · today's cap ${Math.round((allowance ?? 0) * 100)}% · at this pace ${Math.round(projected * 100)}% by reset"><path d="${arc(1)}" fill="none" stroke="var(--edge)" stroke-width="9" stroke-linecap="round"/><path d="${arc(u)}" fill="none" stroke="${col}" stroke-width="9" stroke-linecap="round"/><circle cx="${ax}" cy="${ay}" r="3.5" fill="var(--ink)"/><text x="56" y="52" text-anchor="middle" font-family="Chakra Petch" font-weight="600" font-size="20" fill="var(--ink)">${Math.round(u * 100)}%</text></svg>`;
  }
  function gantt(products) {
    const day = 86400000, today = Date.now();
    const starts = products.map(p => p.startedAt && Date.parse(p.startedAt)).filter(Boolean);
    const ends = products.flatMap(p => [p.extras.deliveredAt, p.forecast.p50, p.committedDate].filter(Boolean).map(d => Date.parse(d)));
    const lo = Math.min(...starts, today) - 2 * day, hi = Math.max(...ends, today + 7 * day) + 3 * day;
    const X = t => ((t - lo) / (hi - lo)) * 100;
    const ticks = []; for (let t = lo + ((8 - new Date(lo).getUTCDay()) % 7) * day; t < hi; t += 7 * day) ticks.push(t);
    const axis = `<div class="gantt-row"><span></span><div style="position:relative;height:16px">${ticks.map((t, i) => `<span class="ax${i % 2 ? ' odd' : ''}" style="position:absolute;left:${X(t)}%;transform:translateX(-50%);font-size:10px;color:var(--faint);font-family:var(--mono)">${new Date(t).toLocaleDateString(undefined, { day: 'numeric', month: 'short' })}</span>`).join('')}</div></div>`;
    const rows = products.map(p => {
      if (!p.startedAt) return '';
      const s = Date.parse(p.startedAt), done = p.extras.deliveredAt && Date.parse(p.extras.deliveredAt);
      const end = done || (p.forecast.p50 ? Date.parse(p.forecast.p50) : today);
      const col = p.health === 'delivered' ? 'var(--green)' : p.health === 'late' ? 'var(--red)' : p.health === 'at-risk' ? 'var(--amber)' : 'var(--cyan)';
      const solidEnd = done || today;
      const tipTxt = `<b>${esc(p.name)}</b><br>started ${wk(p.startedAt.slice(0, 10))}${done ? '<br>delivered ' + wk(p.extras.deliveredAt.slice(0, 10)) : p.forecast.p50 ? '<br>forecast ' + wk(p.forecast.p50) : '<br>stalled'}${p.committedDate ? '<br>committed ' + wk(p.committedDate) : ''}`;
      return `<div class="gantt-row"><span data-p="${esc(p.id)}">${esc(p.name)}</span><div style="position:relative;height:16px" data-tip="${tipTxt}">
        <div style="position:absolute;left:${X(s)}%;width:${Math.max(0.6, X(solidEnd) - X(s))}%;top:4px;height:8px;border-radius:99px;background:${col};box-shadow:0 0 8px ${col}"></div>
        ${!done && end > today ? `<div style="position:absolute;left:${X(today)}%;width:${X(end) - X(today)}%;top:5px;height:6px;border-radius:99px;border:1px dashed ${col};opacity:.7"></div>` : ''}
        ${p.committedDate ? `<div style="position:absolute;left:${X(Date.parse(p.committedDate))}%;top:1px;transform:translateX(-50%) rotate(45deg);width:9px;height:9px;background:var(--ink)"></div>` : ''}</div></div>`;
    }).join('');
    return `<div style="position:relative">${axis}${rows}<div style="position:absolute;top:0;bottom:0;left:calc(170px + 10px + (100% - 180px) * ${X(today) / 100});border-left:1px dashed var(--amber);opacity:.6;pointer-events:none"></div></div>`;
  }
  function heatmap(T, products) {
    const all = products.flatMap(p => T.deliveredByProduct[p.id]), max = Math.max(...all, 1);
    const cols = `grid-template-columns:minmax(90px,170px) repeat(${T.weeks.length},1fr)`;
    const head = `<div class="heat" style="${cols}"><span></span>${T.weeks.map(w => `<span class="h">${wk(w)}</span>`).join('')}</div>`;
    const rows = products.map(p => `<div class="heat" style="${cols}"><span class="n">${esc(p.name)}</span>${T.deliveredByProduct[p.id].map((v, i) => `<span class="c" style="background:rgba(77,227,255,${v ? 0.12 + 0.75 * (v / max) : 0.03});color:${v / max > 0.55 ? '#021018' : 'var(--dim)'}" data-tip="<b>${esc(p.name)}</b><br>${wk(T.weeks[i])}: ${v} delivered">${v || ''}</span>`).join('')}</div>`).join('');
    return `<div style="display:flex;flex-direction:column;gap:3px">${head}${rows}</div>`;
  }
  function sinceStrip(P_, T) {
    let prev = null; try { prev = JSON.parse(localStorage.getItem('dash-seen') || 'null'); } catch {}
    const now = { at: snap.generatedAt, bugs: T.bugsOpenTotal.at(-1), p: Object.fromEntries(P_.map(p => [p.id, { d: p.done, h: p.health, f: p.forecast.p50 }])) };
    try { if (!prev || prev.at !== now.at) localStorage.setItem('dash-seen', JSON.stringify(now)); } catch {}
    if (!prev || prev.at === now.at) return '';
    const chips = [];
    P_.forEach(p => { const o = prev.p[p.id]; if (!o) return;
      if (p.done > o.d) chips.push(`<span class="chip"><b>${esc(p.name)}</b> +${p.done - o.d} done</span>`);
      if (o.h !== p.health) chips.push(`<span class="chip"><b>${esc(p.name)}</b> ${ST[o.h][1]} → ${ST[p.health][1]}</span>`);
      if (o.f && p.forecast.p50 && p.forecast.p50 > o.f) chips.push(`<span class="chip"><b>${esc(p.name)}</b> forecast slipped to ${wk(p.forecast.p50)}</span>`); });
    if (now.bugs !== prev.bugs) chips.push(`<span class="chip">open bugs <b>${prev.bugs} → ${now.bugs}</b></span>`);
    return chips.length ? `<div class="since"><span class="label" style="align-self:center">Since you last looked</span>${chips.join('')}</div>` : '';
  }

  // ---------- Product (home) ----------
  function product() {
    const T = snap.trends, labels = T.weeks.map(wk), P_ = snap.products;
    const sum = a => a.reduce((x, y) => x + y, 0);
    const delivered = T.weeks.map((_, i) => sum(P_.map(p => T.deliveredByProduct[p.id][i])));
    const bugs = T.weeks.map((_, i) => sum(P_.map(p => T.bugsByProduct[p.id][i])));
    const thisW = delivered.at(-1), lastW = delivered.at(-2) ?? 0, dlt = thisW - lastW;
    const shipped = P_.filter(p => p.health === 'delivered').length;
    const hero = `<div class="hero">
      <div class="tile"><span class="label">Products complete</span><span class="big">${shipped}<span style="color:var(--faint);font-size:1.2rem"> / ${P_.length}</span></span></div>
      <div class="tile"><span class="label">Delivered this week</span><span class="big">${thisW}</span><span class="sub ${dlt >= 0 ? 'up' : 'down'}">${dlt >= 0 ? '▲' : '▼'} ${Math.abs(dlt)} vs last week</span></div>
      <div class="tile"><span class="label">Open bugs</span><span class="big">${T.bugsOpenTotal.at(-1)}</span><span class="sub">${T.bugsOpenTotal.at(-1) <= (T.bugsOpenTotal.at(-2) ?? 0) ? '<span class="up">▼ falling</span>' : '<span class="down">▲ rising</span>'}</span></div>
      <div class="tile" style="align-items:flex-start"><span class="label">Weekly usage</span>${gauge(snap.usage.utilization, snap.usage.allowanceToday, snap.usage.projectedAtReset ?? 0)}<span class="sub">${snap.usage.projectedAtReset != null ? (snap.usage.projectedAtReset > 0.9 ? '<span class="down">▲ ' : '<span class="up">● ') + Math.round(snap.usage.projectedAtReset * 100) + '% by reset</span>' : ''}</span></div></div>`;
    const tiles = P_.map(p => `<button class="prod" data-p="${esc(p.id)}"><h3><span>${esc(p.name)}</span>${status(p.health)}</h3>${ring(p.done, p.total)}<div>${mini(p)}</div>
      ${stageBar(p.extras.release)}<div class="dates"><span>${p.committedDate ? '◆ ' + wk(p.committedDate) : '◆ —'}</span><span>${p.health === 'delivered' ? 'done' : p.forecast.p50 ? '→ ' + wk(p.forecast.p50) : '→ stalled'}</span></div></button>`).join('');
    const layers = causeLayers(T.waitByCause);
    const X_ = T.extra, filerLayers = FILER.map(([k, c, n]) => ({ name: n, color: c, values: X_.bugsByFiler[k] }));
    shell(hero + sinceStrip(P_, T) + `<h2 class="sec">Products</h2><div class="grid">${tiles}</div>
      <h2 class="sec">Timeline</h2><div class="chart" style="margin-bottom:28px">${gantt(P_)}<p class="note" style="margin-top:8px">Solid = done so far · dashed = forecast · ◆ committed date · amber line = today</p></div>
      <h2 class="sec">Where effort went · stories delivered per week</h2><div class="chart" style="margin-bottom:28px">${heatmap(T, P_)}</div>
      <h2 class="sec">Trends · last 6 weeks</h2><div class="charts">
        <div class="chart"><h3>Delivered per week</h3>${bars(delivered, labels, 'var(--cyan)', 'stories')}</div>
        <div class="chart"><h3>Open bugs</h3>${lines([{ name: 'Open bugs', values: T.bugsOpenTotal, color: '#d55181', area: true }], labels, '')}</div>
        <div class="chart"><h3>New bugs per week</h3>${bars(bugs, labels, '#d95926', 'bugs')}</div>
        <div class="chart"><h3>Hours to deliver a story · median</h3>${lines([{ name: 'Median', values: T.medianHoursToDone, color: '#199e70', area: true }], labels, 'h')}</div>
        <div class="chart"><h3>Hours to fix a bug · median</h3>${lines([{ name: 'Median', values: X_.bugFixHours, color: '#d55181', area: true }], labels, 'h')}</div>
        <div class="chart"><h3>Who found the bugs</h3>${legend(filerLayers)}${stacked(filerLayers, labels, 'bugs')}</div>
        <div class="chart"><h3>Rework · send-backs per review</h3>${lines([{ name: 'Send-backs per review', values: X_.sendBackRate, color: '#c98500', area: true }], labels, '')}</div>
        <div class="chart"><h3>Model use per week · ₹ equivalent</h3>${bars(X_.costInr, labels, '#9085e9', '₹')}</div></div>
      <p class="note">Bars under each product: <span style="color:#3cf2a0">in prod</span> · <span style="color:#9085e9">on staging</span> · <span style="color:#3987e5">merged</span> · ◆ committed date · → forecast at the current pace · ring = stories done · mini chart: done (solid) vs total scope (dashed)</p>`);
  }

  // ---------- Product detail ----------
  function detail(id) {
    const p = snap.products.find(x => x.id === id); if (!p) { location.hash = 'product'; return; }
    const T = snap.trends, labels = T.weeks.map(wk);
    const eps = snap.features.filter(f => p.epics.includes(f.id));
    const waits = {}; eps.forEach(f => Object.entries(f.lostDays).forEach(([c, v]) => { if (c !== 'parked') waits[c] = (waits[c] || 0) + v; }));
    const wl = Object.entries(waits).sort((a, b) => b[1] - a[1]).slice(0, 5);
    const wmax = Math.max(...wl.map(x => x[1]), 1);
    const waitBars = wl.map(([c, v], i) => `<div class="ep" data-tip="${esc(CAUSE[c]?.[0] ?? c)}: ${Math.round(v * 10) / 10} story-days"><span>${esc(CAUSE[c]?.[0] ?? c)}</span><div class="meter"><i style="width:${(v / wmax) * 100}%;background:${CAUSE_COLORS[i]}"></i></div><span class="mono">${Math.round(v)}</span></div>`).join('');
    const epRows = eps.sort((a, b) => (a.done + a.remaining) - (b.done + b.remaining)).reverse().map(f => { const t = f.done + f.remaining, pc = t ? Math.round((f.done / t) * 100) : 0;
      return `<div class="ep" data-tip="${f.done} of ${t} stories done"><span>${esc(f.name)}</span><div class="meter"><i style="width:${pc}%"></i></div><span class="mono">${pc}%</span></div>`; }).join('');
    shell(`<button class="ghost back" id="back">← Products</button>
      <div class="dhead"><h2>${esc(p.name)}</h2>${status(p.health)}</div>
      <div class="hero">
        <div class="tile"><span class="label">Done</span><span class="big">${p.done}<span style="color:var(--faint);font-size:1.2rem"> / ${p.total}</span></span></div>
        <div class="tile"><span class="label">Committed</span><span class="big mono" style="font-size:1.6rem">${p.committedDate ? wk(p.committedDate) : '—'}</span></div>
        <div class="tile"><span class="label">Forecast</span><span class="big mono" style="font-size:1.6rem">${p.health === 'delivered' ? 'Done' : p.forecast.p50 ? wk(p.forecast.p50) : 'Stalled'}</span>${p.forecast.p90 && p.health !== 'delivered' ? `<span class="sub">worst case ${wk(p.forecast.p90)}</span>` : ''}</div>
        <div class="tile"><span class="label">Running for</span><span class="big">${p.ageDays ?? '—'}<span style="color:var(--faint);font-size:1.2rem"> d</span></span></div>
        <div class="tile"><span class="label">Where it is</span><span class="sub">${p.extras.release.prod} in prod · ${p.extras.release.staging} on staging · ${p.extras.release.merged} merged</span>${stageBar(p.extras.release)}</div>
        <div class="tile"><span class="label">Model use · ₹ equiv.</span><span class="big" style="font-size:1.6rem">₹${p.extras.costInr.toLocaleString('en-IN')}</span><span class="sub">₹${p.extras.costPerDelivered ?? '—'} per delivered story</span></div>
        <div class="tile"><span class="label">Rework</span><span class="big" style="font-size:1.6rem">${p.extras.sendBacksPerStory ?? '—'}</span><span class="sub">send-backs per reviewed story</span></div></div>
      <div class="charts">
        <div class="chart"><h3>Burn-up</h3>${legend([{ name: 'Done', color: 'var(--cyan)' }, { name: 'Total scope', color: 'var(--faint)' }])}${lines([{ name: 'Done', values: p.burnup.done, color: 'var(--cyan)', area: true }, { name: 'Total scope', values: p.burnup.total, color: '#8295b1', dash: true }], labels, 'stories')}</div>
        <div class="chart"><h3>Delivered per week</h3>${bars(p.weekly.delivered, labels, 'var(--cyan)', 'stories')}</div>
        <div class="chart"><h3>New bugs per week</h3>${bars(p.weekly.bugs, labels, '#d95926', 'bugs')}</div>
        <div class="chart"><h3>Who found its bugs</h3><div class="epics" style="margin-top:6px">${FILER.map(([k, c, n]) => { const v = p.extras.bugsByFiler[k], m = Math.max(...Object.values(p.extras.bugsByFiler), 1); return `<div class="ep"><span>${n}</span><div class="meter"><i style="width:${(v / m) * 100}%;background:${c}"></i></div><span class="mono">${v}</span></div>`; }).join('')}</div></div>
        <div class="chart"><h3>Model use per week · ₹ equivalent</h3>${bars(p.extras.weeklyCost, labels, '#9085e9', '₹')}</div>
        <div class="chart"><h3>Where waiting went · story-days</h3><div class="epics" style="margin-top:6px">${waitBars || '<p class="note">No waiting recorded.</p>'}</div></div></div>
      <h2 class="sec">Parts</h2><div class="chart"><div class="epics">${epRows}</div></div>`);
    $('#back').onclick = () => { location.hash = 'product'; };
  }

  // ---------- Workplace (gaps) ----------
  function workplace() {
    const g = snap.gaps, T = snap.trends, labels = T.weeks.map(wk), rw = g.reviewWait;
    const layers = causeLayers(T.waitByCause);
    shell(`<div class="hero">
        <div class="tile"><span class="label">Review · approval 1</span><span class="big">${rw.approval1Minutes.p50 ?? '—'}<span style="color:var(--faint);font-size:1.2rem"> min</span></span><span class="sub">90% within ${rw.approval1Minutes.p90 ?? '—'} min</span></div>
        <div class="tile"><span class="label">Review · approval 2</span><span class="big">${rw.approval2Minutes.p50 ?? '—'}<span style="color:var(--faint);font-size:1.2rem"> min</span></span><span class="sub">90% within ${rw.approval2Minutes.p90 ?? '—'} min</span></div>
        <div class="tile"><span class="label">Staging down · 30 d</span><span class="big">${g.stagingDownDays}<span style="color:var(--faint);font-size:1.2rem"> d</span></span></div>
        <div class="tile"><span class="label">Not classified</span><span class="big">${Math.round(snap.unknownShare * 100)}<span style="color:var(--faint);font-size:1.2rem">%</span></span><span class="sub">of waiting time</span></div></div>
      <div class="charts">
        <div class="chart" style="grid-column:1/-1"><h3>Waiting by cause · story-days per week</h3>${legend(layers)}${wide(() => stacked(layers, labels, 'story-days'))}</div>
        <div class="chart"><h3>Lost story-days · last 30 days</h3><div class="epics" style="margin-top:6px">${g.lostDaysByCause.slice(0, 8).map(x => { const m = g.lostDaysByCause[0].days || 1; return `<div class="ep" data-tip="${esc(CAUSE[x.cause]?.[0] ?? x.cause)}: ${x.days}"><span>${esc(CAUSE[x.cause]?.[0] ?? x.cause)}</span><div class="meter"><i style="width:${(x.days / m) * 100}%;background:var(--violet)"></i></div><span class="mono">${Math.round(x.days)}</span></div>`; }).join('')}</div></div>
        <div class="chart"><h3>Hours to deliver a story · median</h3>${lines([{ name: 'Median', values: T.medianHoursToDone, color: '#199e70', area: true }], labels, 'h')}</div>
        <div class="chart"><h3>Idle while work waited · person-hours</h3>${bars(T.extra.idleHours, labels, '#c98500', 'person-hours')}</div>
        <div class="chart"><h3>Your decisions · median hours waiting</h3>${lines([{ name: 'Median wait', values: T.extra.ownerWaitHours, color: '#3987e5', area: true }], labels, 'h')}</div>
        <div class="chart"><h3>Model use per day · ₹ equivalent</h3>${bars(snap.usage.dailyInr.map(d => d.inr), snap.usage.dailyInr.map(d => wk(d.day)), '#9085e9', '₹')}</div></div>
      <p class="note">Model use is the ₹-equivalent value of subscription usage, not money billed. Idle: hours someone had nothing in progress while a Ready story in their area waited on a busy colleague. Story-days add up each waiting story, so stories waiting at the same time each count. Parked work is left out, because it was put aside on purpose.</p>`);
  }

  // ---------- Router ----------
  function route() {
    if (!snap) return;
    const h = location.hash.slice(1);
    if (h.startsWith('p-')) { tab = 'product'; detail(h.slice(2)); }
    else if (h === 'workplace') { tab = 'workplace'; workplace(); }
    else { tab = 'product'; product(); }
    window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', route);

  async function load() {
    const r = await api('/api/snapshot');
    if (r.status === 401) { gate(); return false; }
    if (!r.ok) { app.innerHTML = '<div class="empty">The dashboard data is not available right now. Try again in a few minutes.</div>'; return false; }
    snap = await r.json();
    return true;
  }
  async function boot() {
    try { if (await load()) route(); } catch { app.innerHTML = '<div class="empty">No connection. Reload to try again.</div>'; }
  }
  // Fresh numbers without a manual refresh: reload the snapshot every 10 minutes while open, and on return to the tab.
  setInterval(() => { if (snap && !document.hidden) load().then(ok => ok && route()); }, 600000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && snap) load().then(ok => ok && route()); });
  boot();
})();
</script>
</body>
</html>
